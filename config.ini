; OneNote Sync Watcher configuration.
; Installed next to the executables (C:\Program Files\OneNoteWatcher\config.ini). Edit via the tray
; menu "Open config.ini". The apps re-read it on restart (tray: Quit + relaunch from Task Scheduler,
; or just log off/on).

[general]
poll_minutes = 5              ; how often the cloud-side check (Graph) runs
grace_minutes = 10           ; a local change may stay un-uploaded this long before it counts as stuck
log_level = info             ; error | warn | info
log_retention_days = 14      ; all logs under <shared_dir>\logs older than this are deleted
; Pipeline liveness. If OneNote is running and the watcher receives NO Office telemetry at all within
; this window, its ETW pipeline is dead and a sync failure would go unnoticed -> error.
; Measured on real sessions: gaps between ANY Office telemetry never exceeded 17 min, while gaps
; between OneNote SYNC events reach 114 min when idle. So this deliberately watches telemetry, not
; syncs -- watching syncs would fire every time you leave OneNote open and idle.
pipeline_timeout_minutes = 45

[graph]
; Microsoft Graph gives (a) section names for failures and (b) the no-admin cloud-side check.
; Sign in once from the "Show issues & status" window.
enabled = true
client_id = eecee773-5ffb-48f1-be33-41dff06da7f9
tenant = consumers           ; "consumers" = personal Microsoft account

[etw]
; Real-time sync logging via the elevated collector (Scheduled Task installed by scripts\install.ps1).
enabled = true
; The ONE root folder: executables, this file, status.json, section-names.json and logs\ all live there.
; Defaults to the folder the executables run from; set it explicitly so a tray started from the build
; output (dev) still talks to the installed collector.
shared_dir = C:\ProgramData\OneNoteWatcher

[ignore]
; Any issue matching a rule here is suppressed (no alert, still recorded in history).
; Wildcards * and ? ; wrap in /.../ for regex, add i for case-insensitive: /.../i
codes     =                  ; e.g. 0xE4020040, 0xE402*
messages  = /are you sure/i  ; suppress OneNote confirmation dialogs by default
notebooks =                  ; e.g. Scratch*
sections  =                  ; e.g. Work/Archive*
detectors =                  ; e.g. oalerts
; The watcher is FAIL-CLOSED: any OneNote event it cannot prove successful becomes a warning, so a
; future/unknown sync failure is never missed. Use this to silence a specific event once you are
; satisfied it is benign. Run "OneNoteWatcher.Collector.exe --audit" to see how events are classified.
events    =                  ; e.g. Office.OneNote.Storage.RealTime.SyncBlockerInstantiated

[transient]
; The watcher has TWO STATES: error and success. Every failure OneNote reports is an error straight
; away — there is no middle "warning" tier, because that is the tier people learn to ignore.
;
; This section is the one deliberate exception, and only for codes YOU list. A code listed here is
; held back until it happens `threshold` times within `window_minutes` — useful for genuinely
; retryable errors (e.g. 0xE000078B server timeout) that usually succeed on the next attempt.
; Held-back occurrences are still written to the sync history, so nothing is lost.
; Empty (the default) = nothing is ever held back.
codes =
threshold = 3
window_minutes = 30
